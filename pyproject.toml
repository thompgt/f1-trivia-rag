[project]
name = "f1-trivia-rag"
version = "0.1.0"
description = "RAG chatbot for Formula 1 historical stats and trivia"
requires-python = ">=3.11"
# Every dependency carries an upper bound. LlamaIndex integration packages in
# particular make breaking changes at the minor level - the Gemini integrations this
# project used were deprecated and then dropped - so an unbounded ">=" is a build that
# breaks on someone else's machine at a time nobody chose.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.4,<3.0",
    "llama-index-core>=0.14,<0.15",
    "llama-index-llms-google-genai>=0.9,<0.10",
    "llama-index-embeddings-google-genai>=0.5,<0.6",
    "llama-index-vector-stores-chroma>=0.5,<0.6",
    "chromadb>=1.0,<2.0",
    "google-genai>=1.0,<3.0",
    "requests>=2.32,<3.0",
    "wikipedia>=1.4,<2.0",
    "fastf1>=3.4,<4.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.6,<1.0",
    "ipykernel>=6.29,<7.0",
    "jupyter>=1.0,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real Gemini API (needs GEMINI_API_KEY); excluded by CI and the pre-commit hook",
]

[tool.ruff]
line-length = 110
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
